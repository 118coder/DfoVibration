name: build-windows

# 云端构筑 (用户决策 2026-11-09: 本机构筑太慢 → GitHub Actions 代建)。
# 配方与既有 ci.yml 一致 (PR #10/#11 全绿): RUSTUP_TOOLCHAIN=1.96.0 → **MSVC 宿主直构**
# (runner rustup 解析不了全三元 gnu channel; MSVC 下 embed-resource 走 rc.exe 链路一致)。
# ⚠ 云端产物 = MSVC 工具链构建 (功能等价); 本地交付仍以 MinGW 为准 (中文路径铁律不动)。
# 分支: release/v24.50-audio-haptics (音频震动; full 变体内嵌 YAMNet 模型)。
on:
  push: # 任意分支触发
  workflow_dispatch:

env:
  RUSTUP_TOOLCHAIN: "1.96.0"
  CARGO_HTTP_TIMEOUT: "120"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (MSVC host, 与 ci.yml 同配方)
        run: rustup toolchain install 1.96.0

      # v24.50 full 变体: 下载官方 YAMNet (Apache-2.0) → build.rs 检测 models/yamnet.onnx
      # → include_bytes 内嵌 (个人版 15MB, 离线可用; 无文件则自动降级纯 DSP)
      - name: Download YAMNet model (Apache-2.0)
        shell: bash
        run: |
          mkdir -p models
          curl -sSL --retry 3 "https://huggingface.co/audiomagic/yamnet-onnx/resolve/main/yamnet.onnx" -o models/yamnet.onnx
          ls -la models/



      - name: Build (release)
        run: cargo build --release

      - name: Rename artifact + SHA256
        shell: pwsh
        run: |
          Rename-Item "target/release/sorahk.exe" "DfoVibration-Sorahk_v24.50_audio_yamnet.exe"
          $hash = (Get-FileHash "target/release/DfoVibration-Sorahk_v24.50_audio_yamnet.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DfoVibration-Sorahk_v24.50_audio_yamnet.exe" | Out-File -FilePath "target/release/SHA256SUMS.txt" -Encoding ascii
          Get-Content "target/release/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "SorahkDFO-v24.50-audio"
          path: |
            target/release/DfoVibration-Sorahk_v24.50_audio_yamnet.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error
