name: build-windows

# 云端构筑 (用户决策 2026-11-09; MSVC 宿主直构, 与 ci.yml 同配方 —— PR #10/#11 全绿)。
# ⚠ 云端产物 = MSVC 工具链构建 (功能等价); 本地交付仍以 MinGW 为准 (中文路径铁律不动)。
#
# ★v24.60 单变体 (用户拍板): 音频震动引擎改为纯算法内嵌 (无 YAMNet/MRX 模型,
# 无 tract-onnx), 三变体 (embedded/mod/slim) 合并为单 exe, 无需下载任何模型。

on:
  push: # 任意分支触发
  workflow_dispatch:

env:
  RUSTUP_TOOLCHAIN: "1.96.0"
  CARGO_HTTP_TIMEOUT: "120"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (MSVC host, 与 ci.yml 同配方)
        run: rustup toolchain install 1.96.0

      - name: Build (release)
        run: cargo build --release

      - name: Rename artifact + SHA256
        shell: pwsh
        run: |
          Rename-Item "target/release/sorahk.exe" "DfoVibration-Sorahk_R2.1.exe"
          $hash = (Get-FileHash "target/release/DfoVibration-Sorahk_R2.1.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DfoVibration-Sorahk_R2.1.exe" | Out-File -FilePath "target/release/SHA256SUMS.txt" -Encoding utf8
          Get-Content "target/release/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "DfoVibration-Sorahk_R2.1.exe"
          path: |
            target/release/DfoVibration-Sorahk_R2.1.exe
            target/release/SHA256SUMS.txt
