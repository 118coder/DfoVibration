# CI (★R1.1): 每个 PR 在干净 Windows 环境自动构建 + 全量测试。
# RUSTUP_TOOLCHAIN 环境变量覆盖 rust-toolchain.toml 的 gnu 钉扎 (runner 走 MSVC,
# 本机交付仍以 MinGW 为准); 首跑失败根因 = runner rustup 无法解析 gnu 三元组工具链。
# 环境敏感测试跳过 (真实按键注入/键盘钩子需要交互桌面, runner 上必然假失败)。
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0
      - name: Build (iter profile)
        run: cargo build --profile iter
      - name: Run full test suite
        run: cargo test --profile iter --tests --no-fail-fast -- --skip poller_captures_synthesized_keys --skip stuck_key
