# CI (★R1.1): 每个 PR 在干净 Windows 环境自动构建 + 全量测试。
# 首次 PR 时验证一次 (本机 MinGW 工具链与 runner 的 MSVC 可能行为有差,
# 若 runner 编译失败属环境差异, 不阻塞本机交付流程)。
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned)
        run: rustup toolchain install 1.96.0  # 宿主默认 MSVC; 本机交付用 windows-gnu (见 rust-toolchain.toml)
      - name: Build (iter profile)
        run: cargo build --profile iter
      - name: Run full test suite
        run: cargo test --profile iter --tests --no-fail-fast
