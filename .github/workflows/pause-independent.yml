name: pause-independent-validation
on:
  push:
    branches: [fix/pause-independent-haptics-20261124]
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: "1.96.0"
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: v1
      - run: rustup toolchain install 1.96.0
      - run: cargo build --profile iter --locked
      - name: Existing full suite including pause regression guards
        run: cargo test --profile iter --locked --tests --no-fail-fast -- --skip poller_captures_synthesized_keys --skip stuck_key
  release-z:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: size-matrix-z-v1
      - run: rustup toolchain install 1.96.0
      - name: Build z with existing fat LTO / 1 CGU / strip / unwind
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
        run: cargo build --release --locked
      - name: Verify size and record SHA256
        shell: pwsh
        run: |
          $path = 'target/release/sorahk.exe'
          $size = (Get-Item $path).Length
          if ($size -ge 10000000) { throw "EXE exceeds byte limit: $size" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          "$hash  sorahk.exe" | Set-Content target/release/SHA256SUMS.txt
          "bytes=$size sha256=$hash commit=$env:GITHUB_SHA" | Set-Content target/release/build-info.txt
          Get-Content target/release/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pause-independent-optz
          path: |
            target/release/sorahk.exe
            target/release/SHA256SUMS.txt
            target/release/build-info.txt
