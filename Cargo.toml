[package]
name = "sorahk"
version = "0.4.0"
edition = "2024"

[lib]
name = "sorahk"
path = "src/lib.rs"

[[bin]]
name = "sorahk"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.6"

# ★v24.60 音频震动: 纯算法融合引擎, 不再有 feature 分叉 (三变体合并为单 exe)。
# (旧 audio-sem feature 与 tract-onnx 依赖随 AI 模型层一并移除。)
[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Devices_HumanInterfaceDevice",
    # "Win32_Devices_DeviceAndDriverInstallation",  # ★v24.19b HidHide 下线, 专用 feature 一并注释
    # "Win32_Storage_FileSystem",  # ★v24.19b HidHide 下线, 专用 feature 一并注释
    # "Win32_System_IO",  # ★v24.19b HidHide 下线, 专用 feature 一并注释
    "Data_Xml_Dom",
    "UI_Notifications",
    # ★v24.55 检查更新: WinHTTP (系统 TLS/系统代理, 免打包 ca 证书)
    "Win32_Networking_WinHttp",
] }
serde = { version = "1.0.228", features = ["derive"] }
# ★v24.55 检查更新: 解析更新清单 (GitHub Releases API / 自建 update.json)。
# 该 crate 早已在依赖树内 (tract 传递依赖), 此地只是提升为直接依赖, 不新增下载。
serde_json = "1.0.154"
toml = "0.9.8"
anyhow = "1.0.100"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
resvg = "0.44.0"
egui-phosphor = "0.11.0"
usvg = "0.44.0"
# 无头截图导出 (src/gui/headless.rs)。resvg 已把 png 0.18 带进依赖树,
# 这里显式声明只是为了让代码能 `use png::…` —— 不新增任何下载。
png = "0.18.0"
ico = "0.5.0"
rfd = { version = "0.16.0", default-features = false }
scc = "3.4.8"
smallvec = { version = "1.15.1", features = ["serde"] }
# ★v24.50 音频震动: WASAPI 环回采集 (loopback + 按进程环回) + FFT 频谱分析。
# wasapi/rustfft 均 MIT/Apache 纯 Rust; 红线组件 aubio(GPL)/essentia(AGPL) 禁用 (见调研报告 §5)。
# ★v24.60: tract-onnx 随 YAMNet/MRX AI 层一并移除 (纯算法引擎, 无模型依赖)。
wasapi = "0.27.0"
rustfft = "6.4.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 绝对稳定化: abort → unwind。任何线程 panic 不再直接杀死整个进程,
# 由全局 panic hook 写崩溃日志 + 线程级 catch_unwind 兜底, 进程保持存活。
panic = "unwind"
strip = true
incremental = false

# 日常迭代 profile: 跳过 fat-LTO/单 CGU 整程序优化, 改代码→运行循环快数倍。
# 交付仍用 --release (cargo build --profile iter 用于快速自测)。
[profile.iter]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
