[package]
name = "sorahk"
version = "0.4.0"
edition = "2024"

[lib]
name = "sorahk"
path = "src/lib.rs"

[[bin]]
name = "sorahk"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.6"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Devices_HumanInterfaceDevice",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
anyhow = "1.0.100"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
resvg = "0.44.0"
egui-phosphor = "0.11.0"
usvg = "0.44.0"
ico = "0.5.0"
rfd = { version = "0.16.0", default-features = false }
scc = "3.4.8"
smallvec = { version = "1.15.1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 绝对稳定化: abort → unwind。任何线程 panic 不再直接杀死整个进程,
# 由全局 panic hook 写崩溃日志 + 线程级 catch_unwind 兜底, 进程保持存活。
panic = "unwind"
strip = true
incremental = false

# 日常迭代 profile: 跳过 fat-LTO/单 CGU 整程序优化, 改代码→运行循环快数倍。
# 交付仍用 --release (cargo build --profile iter 用于快速自测)。
[profile.iter]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false
